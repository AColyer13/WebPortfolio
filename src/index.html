<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121218" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Portfolio of Adam Colyer, a full-stack developer building React, Next.js, Python, and AI applications with live project demos and a downloadable resume."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adam Colyer — Full-stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Adam Colyer, a full-stack developer building React, Next.js, Python, and AI applications with live project demos and a downloadable resume."
    />
    <meta property="og:image" content="https://acolyer13.github.io/WebPortfolio/images/IMG_4874.JPEG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adam Colyer — Full-stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Adam Colyer, a full-stack developer building React, Next.js, Python, and AI applications with live project demos and a downloadable resume."
    />
    <meta name="twitter:image" content="https://acolyer13.github.io/WebPortfolio/images/IMG_4874.JPEG" />
    <link rel="canonical" href="https://acolyer13.github.io/WebPortfolio/" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Hero (LCP) preload — AVIF with responsive srcset; WebP/JPEG via <picture>. -->
    <link
      rel="preload"
      as="image"
      href="/images/IMG_4874-1920.avif"
      type="image/avif"
      imagesrcset="/images/IMG_4874-960.avif 960w, /images/IMG_4874-1920.avif 1920w"
      imagesizes="(min-width: 64rem) 40vw, 100vw"
    />
    <title>Adam Colyer — Full-stack Developer Portfolio</title>
    <link rel="stylesheet" href="/index.css" />
    <script>
      document.documentElement.setAttribute('data-theme', 'system')
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return
        var sheets = document.querySelectorAll('link[rel="stylesheet"]')
        for (var i = 0; i < sheets.length; i++) {
          if (sheets[i].sheet) return
        }
        location.reload()
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
