<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Adam Colyer — full-stack developer. Production React, Next.js, Python and AI apps; live project walkthroughs and a downloadable resume."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adam Colyer — Full-stack Developer" />
    <meta
      property="og:description"
      content="Production React, Next.js, Python and AI apps. Live project walkthroughs, experience timeline, and a downloadable resume."
    />
    <meta property="og:image" content="https://acolyer13.github.io/Portfolio-Website/images/IMG_4874.JPEG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adam Colyer — Full-stack Developer" />
    <meta
      name="twitter:description"
      content="Production React, Next.js, Python and AI apps. Live project walkthroughs, experience timeline, and a downloadable resume."
    />
    <meta name="twitter:image" content="https://acolyer13.github.io/Portfolio-Website/images/IMG_4874.JPEG" />
    <link rel="canonical" href="https://acolyer13.github.io/Portfolio-Website/" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Hero (LCP) preload. `imagesrcset` lets the browser pick the right
         width for the viewport while fetching in parallel with the JS parse.
         Each format is gated by `type=` so a browser only fetches the one
         matching its capabilities (AVIF-capable → AVIF, otherwise WebP,
         otherwise JPEG fallback). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/IMG_4874-960.avif 960w, /images/IMG_4874-1920.avif 1920w"
      imagesizes="(min-width: 48rem) 45vw, 92vw"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/IMG_4874-960.webp 960w, /images/IMG_4874-1920.webp 1920w"
      imagesizes="(min-width: 48rem) 45vw, 92vw"
    />
    <link
      rel="preload"
      as="image"
      imagesrcset="/images/IMG_4874-960.JPEG 960w, /images/IMG_4874-1920.JPEG 1920w, /images/IMG_4874.JPEG 2048w"
      imagesizes="(min-width: 48rem) 45vw, 92vw"
    />
    <!-- DNS + TLS warm-up before the user clicks "Load map" or submits the form. -->
    <link rel="preconnect" href="https://api.emailjs.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com/maps" />
    <title>Adam Colyer — Full-stack Developer Portfolio</title>
    <link rel="stylesheet" href="/index.css" />
    <script>
      document.documentElement.setAttribute('data-theme', 'system')
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return
        var sheets = document.querySelectorAll('link[rel="stylesheet"]')
        for (var i = 0; i < sheets.length; i++) {
          if (sheets[i].sheet) return
        }
        location.reload()
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
