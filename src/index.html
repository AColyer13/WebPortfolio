<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080A" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Portfolio of Adam Colyer, a full-stack engineer building React, Next.js, Python, and AI applications with live project demos and a downloadable resume."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adam Colyer — Full-stack Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Adam Colyer, a full-stack engineer building React, Next.js, Python, and AI applications with live project demos and a downloadable resume."
    />
    <meta property="og:url" content="https://acolyer13.github.io/WebPortfolio/" />
    <meta property="og:image" content="https://acolyer13.github.io/WebPortfolio/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Adam Colyer, Twin Cities, MN."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adam Colyer — Full-stack Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Adam Colyer, a full-stack engineer building React, Next.js, Python, and AI applications with live project demos and a downloadable resume."
    />
    <meta name="twitter:image" content="https://acolyer13.github.io/WebPortfolio/og-card.jpg" />
    <link rel="canonical" href="https://acolyer13.github.io/WebPortfolio/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Hero (LCP) preload — AVIF with responsive srcset; WebP/JPEG via <picture>. -->
    <link
      rel="preload"
      as="image"
      href="/images/IMG_4874-1920.avif"
      type="image/avif"
      media="(min-width: 64rem)"
      imagesrcset="/images/IMG_4874-960.avif 960w, /images/IMG_4874-1920.avif 1920w"
      imagesizes="(min-width: 64rem) 40vw, 100vw"
    />
    <title>Adam Colyer — Full-stack Engineer Portfolio</title>
    <link rel="stylesheet" href="/index.css" />
    <style>
      /* First-frame shell: painted from HTML alone, replaced when React mounts. */
      .boot-shell { min-height: 100svh; background: var(--bg-canvas, #f4f4f6); }
      .boot-bar {
        height: 3.5rem;
        background: var(--bg-glass, rgba(255, 255, 255, 0.8));
        border-bottom: 1px solid var(--bg-fill-hover, rgba(24, 24, 27, 0.1));
      }
      .boot-body { max-width: 72rem; margin: 0 auto; padding: 6rem 1rem 0; display: grid; gap: 1rem; }
      .boot-line { height: 1rem; border-radius: 0.5rem; background: var(--bg-fill-tertiary, rgba(24, 24, 27, 0.06)); }
      .boot-line--title { height: 2.5rem; width: min(28rem, 80%); }
      .boot-line--short { width: min(20rem, 60%); }
    </style>
    <script>
      ;(function () {
        try {
          var k = 'portfolio-theme-session-override'
          var opposite = sessionStorage.getItem(k) === 'opposite'
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute(
            'data-theme',
            opposite ? (dark ? 'light' : 'dark') : 'system',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'system')
        }
      })()
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return
        var sheets = document.querySelectorAll('link[rel="stylesheet"]')
        for (var i = 0; i < sheets.length; i++) {
          if (sheets[i].sheet) return
        }
        location.reload()
      })
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-bar"></div>
        <div class="boot-body">
          <div class="boot-line boot-line--title"></div>
          <div class="boot-line"></div>
          <div class="boot-line boot-line--short"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
