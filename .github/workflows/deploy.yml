# Build on push to main → deploy dist/ via GitHub Actions (artifact + deploy-pages).
#
# GitHub Pages: Settings → Pages → Source: GitHub Actions (not "Deploy from a branch").
name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Review full dependency audit for regressions
        run: npm run audit:review

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-results/
          if-no-files-found: ignore

      - name: Check (TypeCheck, Lint, Test)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify production bundle
        run: |
          if grep -qF 'main.tsx' dist/index.html; then
            echo "dist/index.html still references main.tsx."
            exit 1
          fi
          if grep -qE 'assets/(index\.css|index\.js)"' dist/index.html; then
            echo "dist/index.html must use content-hashed asset URLs, not index.css/index.js."
            exit 1
          fi

      - name: Install Chrome + ChromeDriver for axe
        run: |
          npx --yes browser-driver-manager@latest install chrome | tee /tmp/browser-install.log
          sed -n -E 's/^(CHROME_TEST_PATH|CHROMEDRIVER_TEST_PATH)="(.*)"$/\1=\2/p' /tmp/browser-install.log >> "$GITHUB_ENV"
          # Use the runner's installed Chrome with its supported Linux sandbox.
          # Downloaded Chrome-for-Testing cannot use Ubuntu's AppArmor profile.
          chrome_path="$(command -v google-chrome)"
          chrome_major="$("$chrome_path" --version | grep -oE '[0-9]+' | head -1)"
          driver_path="$(sed -n -E 's/^CHROMEDRIVER_TEST_PATH="(.*)"$/\1/p' /tmp/browser-install.log)"
          driver_major="$("$driver_path" --version | grep -oE '[0-9]+' | head -1)"
          test "$chrome_major" = "$driver_major"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Accessibility (axe — landmarks, forms, headings)
        run: node scripts/axe-preview.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
