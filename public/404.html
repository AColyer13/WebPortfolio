<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Adam Colyer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-canvas: #f4f4f6;
        --bg-surface: #ffffff;
        --text-primary: #111113;
        --text-secondary: #52525b;
        --text-on-accent: #ffffff;
        --border-hairline: rgba(0, 0, 0, 0.09);
        --specular-top: rgba(255, 255, 255, 0.9);
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --font-display: 'Newsreader Variable', 'Newsreader', Georgia, serif;
        --font-sans: 'Source Sans 3 Variable', 'Source Sans 3', 'Plus Jakarta Sans', sans-serif;
        --space-2: 0.5rem;
        --space-4: 1rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --radius-sm: 8px;
        --radius-lg: 16px;
        --ease-spring: cubic-bezier(0.2, 0.9, 0.2, 1);
        --duration-fast: 130ms;
        --control-height: 48px;
      }
      @media (pointer: fine) {
        :root { --control-height: 36px; }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg-canvas: #08080a;
          --bg-surface: #111115;
          --text-primary: #f4f4f6;
          --text-secondary: #a1a1aa;
          --border-hairline: rgba(255, 255, 255, 0.09);
          --specular-top: rgba(255, 255, 255, 0.11);
          --accent: #3b82f6;
          --accent-hover: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding:
          calc(env(safe-area-inset-top, 0px) + var(--space-8))
          calc(env(safe-area-inset-right, 0px) + var(--space-4))
          calc(env(safe-area-inset-bottom, 0px) + var(--space-8))
          calc(env(safe-area-inset-left, 0px) + var(--space-4));
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.5;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
        max-width: 36rem;
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3vw, 2.375rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.12;
      }
      p {
        margin: 0;
        max-width: 65ch;
        color: var(--text-secondary);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--control-height);
        margin-top: var(--space-2);
        padding: 0 var(--space-4);
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--text-on-accent);
        font-weight: 500;
        letter-spacing: -0.01em;
        text-decoration: none;
        box-shadow: inset 0 1px 0 0 var(--specular-top);
        transition: transform var(--duration-fast) var(--ease-spring), background-color var(--duration-fast) var(--ease-spring);
      }
      a:hover { background: var(--accent-hover); }
      a:active { transform: scale(0.98); }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        a { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That page doesn’t exist, but the portfolio does.</p>
      <a href="https://acolyer13.github.io/WebPortfolio/">Back to the portfolio</a>
    </main>
  </body>
</html>
